plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.liberty.mmorpg'
    compileSdk 34

    defaultConfig {
        applicationId "com.liberty.mmorpg"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def storeFileEnv = System.getenv("LIBERTY_KEYSTORE")
            if (storeFileEnv != null) {
                storeFile file(storeFileEnv)
                storePassword System.getenv("LIBERTY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("LIBERTY_KEY_ALIAS")
                keyPassword System.getenv("LIBERTY_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("LIBERTY_KEYSTORE") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
